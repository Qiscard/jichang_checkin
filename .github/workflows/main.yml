name: "Airport Checkin"

on:
  schedule:
    - cron: "10 16 * * *" # 00:10 Asia/Shanghai, away from the busy top of hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Random sleep
        if: github.event_name == 'schedule'
        run: sleep $(shuf -i 10-180 -n 1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import requests, Crypto, curl_cffi, ddddocr, cv2, numpy; print('deps ok')"

      - name: Run offline tests
        run: python -B -m unittest discover -s tests -v

      - name: Run checkin
        env:
          URL: ${{ secrets.URL }}
          CONFIG: ${{ secrets.CONFIG }}
          SCKEY: ${{ secrets.SCKEY }}
          CAPTCHA_ID: ${{ secrets.CAPTCHA_ID }}
          CAPTCHA_RISK_TYPE: ${{ secrets.CAPTCHA_RISK_TYPE }}
          CHECKIN_TIMEZONE: ${{ vars.CHECKIN_TIMEZONE || 'Asia/Shanghai' }}
        run: python main.py
